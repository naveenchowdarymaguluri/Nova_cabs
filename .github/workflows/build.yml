name: Nova Cabs — Build & Release

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      # Secrets are stored in GitHub → Settings → Secrets → Actions
      # They are NEVER written to disk as a file — injected directly as flags
      - name: Build APK (secrets from GitHub Secrets)
        run: |
          flutter build apk --release \
            --dart-define=GOOGLE_MAPS_API_KEY="${{ secrets.GOOGLE_MAPS_API_KEY }}" \
            --dart-define=MSG91_AUTH_KEY="${{ secrets.MSG91_AUTH_KEY }}" \
            --dart-define=MSG91_TEMPLATE_ID="${{ secrets.MSG91_TEMPLATE_ID }}" \
            --obfuscate \
            --split-debug-info=build/debug-info

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-cabs-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk
